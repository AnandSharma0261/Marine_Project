services:
  mongo:
    image: mongo:7
    container_name: marine-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  server:
    build: ./server
    container_name: marine-server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/marine
      JWT_SECRET: change_me_in_production_use_a_long_random_string
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: "*"
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
    container_name: marine-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo_data:
